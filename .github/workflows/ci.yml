name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  # Isolation runs first and on its own. A tenant leak is not "a failing
  # test" among others — it is the one result that must be impossible to
  # miss in the checks list, so it gets its own red X.
  tenant-isolation:
    name: Multi-tenant isolation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: Isolation, accounts and permissions
        run: |
          python -m pytest -q \
            tests/test_tenant_isolation.py \
            tests/test_accounts.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
